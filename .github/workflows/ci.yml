name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator:
    name: Validator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: validator-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: validator-cargo-${{ runner.os }}-

      - name: Check formatting
        run: |
          cargo fmt --check -p junco-policy -p junco-core
          cargo fmt --check --manifest-path fuzz/Cargo.toml

      - name: Lint
        run: |
          cargo clippy --locked --no-deps -p junco-policy -p junco-core --all-targets -- -D warnings
          cargo clippy --locked --no-deps --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --workspace

      - name: No-surprise oracle
        # Release: generation re-checks the whole history at every step (166s debug vs 23s release).
        run: cargo test --locked --release --manifest-path fuzz/Cargo.toml --lib

  verify-core:
    name: Verify junco-core (Verus 0.2026.10.04.426d8b0)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Z3
        shell: bash
        run: |
          set -euxo pipefail
          z3_url=https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip
          z3_sha256=7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e
          curl -fsSL "$z3_url" -o z3.zip
          echo "${z3_sha256}  z3.zip" | sha256sum --check --strict
          unzip -q z3.zip
          echo "$PWD/z3-4.16.0-x64-glibc-2.39/bin" >> "$GITHUB_PATH"
          echo "VERUS_Z3_PATH=$PWD/z3-4.16.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"

      - name: Install Verus and verify all core configurations
        shell: bash
        run: |
          set -euxo pipefail
          asset_url=https://github.com/verus-lang/verus/releases/download/release%2F0.2026.10.04.426d8b0/verus-0.2026.10.04.426d8b0-x86-linux.zip
          asset_sha256=624018662868563a7bec0dd07be5e4dd0c3d61124b4b55105765884bf2d4d1a0
          curl -fsSL "$asset_url" -o verus.zip
          echo "${asset_sha256}  verus.zip" | sha256sum --check --strict
          unzip -q verus.zip -d verus-dist
          verus_bin="$(find "$PWD/verus-dist" -type f -name verus -perm -u+x | head -n1)"
          cargo_verus_bin="$(find "$PWD/verus-dist" -type f -name cargo-verus -perm -u+x | head -n1)"
          version_json="$(find "$PWD/verus-dist" -type f -name version.json | head -n1)"
          test -n "$verus_bin"
          test -n "$cargo_verus_bin"
          test -n "$version_json"
          required_toolchain="$(
            python3 - "$version_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as version_file:
              toolchain = json.load(version_file).get("verus", {}).get("toolchain", "")
          if not toolchain:
              raise SystemExit("missing verus.toolchain in version.json")
          print(toolchain.split()[0])
          PY
          )"
          test "$required_toolchain" = 1.98.1
          rustup toolchain install "$required_toolchain" --profile minimal \
            --component rustc-dev --component llvm-tools --component rustfmt
          export RUSTUP_TOOLCHAIN="$required_toolchain"
          export PATH="$(dirname "$cargo_verus_bin"):$(dirname "$verus_bin"):$PATH"
          cargo fetch --locked
          # No module filters: verify the actual core bodies and verified helper dependencies.
          cargo verus verify --locked -p junco-core --no-default-features
          cargo verus verify --locked -p junco-core --features runtime,std,cache
          cargo verus verify --locked -p junco-core --no-default-features --features runtime

  msrv:
    name: MSRV (Rust 1.98.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Check at the minimum supported Rust
        run: |
          cargo check --locked --workspace --all-targets
          cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets

  fuzz:
    name: libFuzzer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # ASan reserves address space before malloc initialises; on macOS libmalloc then logs
      # "nano zone abandoned due to inability to reserve vm space" on every run. Harmless; this
      # silences it (google/sanitizers#1666). Unused on Linux.
      MallocNanoZone: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust nightly
        # cargo-fuzz needs -Zsanitizer and the sancov passes; the smoke step runs `cargo +nightly`.
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-cargo-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: fuzz-cargo-${{ runner.os }}-

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz for 60 seconds
        # Exit 0 when the time bound is reached without a finding; a crash exits non-zero and
        # writes the input to fuzz/artifacts/lock_policy/.
        run: cargo +nightly fuzz run lock_policy -- -max_total_time=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.os }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
