[workspace]
members = [".", "crates/junco-core", "crates/history-syntax", "crates/history-store", "crates/history-semantics", "crates/history-analysis"]
exclude = ["fuzz", "spec-check"]
resolver = "3"

[package]
name = "junco-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "junco_policy"
path = "src/lib.rs"

[features]
# Only the explicit instrumented progress-test command enables this; benchmarks do not.
test-util = ["history-semantics/test-util"]

[dependencies]
junco-core = { path = "crates/junco-core", default-features = false, features = ["std"] }
history-store = { path = "crates/history-store", default-features = false, features = ["runtime", "std"] }
history-semantics = { path = "crates/history-semantics", default-features = false, features = ["runtime", "std", "cache"] }
history-syntax = { path = "crates/history-syntax", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = "0.5"
history-analysis = { path = "crates/history-analysis", default-features = false, features = ["runtime"] }
resharp = "=0.7.6"
regex-syntax = "0.8"
rig-core = "0.46.0"
rig-reqwest = "0.46.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "validator"
harness = false

[[bench]]
name = "progress"
harness = false

[[bench]]
name = "smt"
path = "benches/smt/main.rs"
harness = false

[[bench]]
name = "agentdojo"
path = "benches/agentdojo/main.rs"
harness = false

[[bench]]
name = "resharp"
path = "benches/resharp/main.rs"
harness = false
