[workspace]
members = [".", "crates/junco-core", "crates/history-syntax", "crates/history-store", "crates/history-semantics"]
exclude = ["fuzz"]
resolver = "3"

[package]
name = "junco-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "junco_policy"
path = "src/lib.rs"

[dependencies]
junco-core = { path = "crates/junco-core", default-features = false, features = ["std"] }
history-store = { path = "crates/history-store", default-features = false, features = ["runtime", "std"] }
history-semantics = { path = "crates/history-semantics", default-features = false, features = ["runtime", "std", "cache"] }
history-syntax = { path = "crates/history-syntax", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = "0.5"
history-semantics = { path = "crates/history-semantics", default-features = false, features = ["test-util"] }

[[bench]]
name = "validator"
harness = false

[[bench]]
name = "progress"
harness = false
