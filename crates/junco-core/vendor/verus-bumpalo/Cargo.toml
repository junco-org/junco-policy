[package]
name = "verus-bumpalo"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = "0.8"
bumpalo = "=3.20.3"
serde_json = "1"

[[bench]]
name = "bump"
harness = false

[package.metadata.verus]
verify = true

[package.metadata.upstream]
repository = "https://github.com/elefthei/bumpus"
revision = "36c8e8723d767934a502fc1d9cea0ba49cff54ab"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }

