[package]
name = "junco-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.verus]
verify = true

[features]
default = []
serde = ["dep:serde"]
runtime = ["dep:verus-bumpalo", "dep:hashconsius", "dep:smallvec", "dep:lru", "dep:hashbrown", "dep:spin"]
std = ["dep:parking_lot", "vstd/std"]
cache = []
test-util = ["runtime"]

[dependencies]
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
frunk_core = { version = "=0.5.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
parking_lot = { version = "0.12", optional = true }
smallvec = { version = "=1.16.2", default-features = false, optional = true }
verus-bumpalo = { path = "vendor/verus-bumpalo", optional = true }
hashconsius = { path = "vendor/hashconsius", default-features = false, optional = true }
lru = { version = "0.18.2", default-features = false, features = ["hashbrown"], optional = true }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"], optional = true }
spin = { version = "0.12.0", default-features = false, features = ["mutex", "spin_mutex", "rwlock"], optional = true }

[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }
