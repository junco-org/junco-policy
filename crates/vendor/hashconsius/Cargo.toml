[package]
name = "hashconsius"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["std"]
std = ["vstd/std"]

[dependencies]
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false, features = ["alloc"] }
verus-bumpalo = { path = "../verus-bumpalo" }

[package.metadata.verus]
verify = true

[package.metadata.upstream]
repository = "https://github.com/elefthei/hashconsius"
revision = "58ab05c67c34201fa25f27c443cb5b45bc3a6c00"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }

